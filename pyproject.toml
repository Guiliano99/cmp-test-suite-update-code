[project]
name = "cmp-test-suite"
version = "0.0.2"
description = "CMP Protocol Compliance Test Suite"
requires-python = ">=3.13"
dependencies = [
    # Bumped from ==46.0.7 to match libattest-py (>=49,<50) so the MockCA can
    # `uv sync` libattest and its deps into one resolved environment.
    "cryptography>=49.0.0,<50.0.0",
    "pyasn1==0.6.3",
    # Bumped from ==0.4.9 to satisfy libattest-py (>=0.4.10).
    "pyasn1-alt-modules>=0.4.10",
    "robotframework==7.4.2",
    "pkilint==0.13.2",
    "robotframework-requests==0.9.7",
    "pycryptodome==3.23.0",
    "tinyec==0.4.0",
    "bitstring==4.4.0",
    "pyhsslms==2.0.0",
    # relevant for the Mock-CA.
    "Flask==3.1.3",
    # relevant for the CMP client tests.
    "jinja2==3.1.6",
    # Remote-attestation model library (MockCA integration).  A uv git dep so
    # `uv sync` pulls libattest + its full locked deps (PyJWT, pydantic, …).
    # NOTE: re-run `uv lock` after pushing libattest-py@UpdateV8 so the lock pins
    # the v5 commit, not the current origin tip.
    "libattest-py @ git+https://github.com/Guiliano99/libattest-py.git@UpdateV8_1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = [
    # Configured by [tool.pytest.ini_options] above, so it must be declared here:
    # without it `uv run pytest` silently resolves to a pytest outside this venv,
    # which cannot import libattest and fails every test at collection.
    "pytest>=8,<9",
    "safety>=3.7.0,<4.0.0",
    "pylint>=4.0.4,<5.0.0",
    "ruff>=0.15.9,<1.0.0",
    "robotframework-robocop==8.2.5",
    "pyright[nodejs]==1.1.408",
    "codespell==2.4.2",
    "reuse==6.2.0",
]
pq = [
    # Post-quantum cryptography support
    # Note: Requires system dependencies (libssl-dev, cmake)
    # Install with: uv pip install -e ".[pq]"
    # The package name in the repo metadata is 'liboqs-python' not 'liboqs-python-stateful-sig'
    "liboqs-python @ git+https://github.com/Guiliano99/liboqs-python-stateful-sig.git",
]
