[project]
name = "cmp-test-suite"
version = "0.0.2"
description = "CMP Protocol Compliance Test Suite"
requires-python = ">=3.13"
dependencies = [
    "cryptography==50.0.2",
    "pyasn1==0.6.5",
    "pyasn1-alt-modules==0.4.10",
    "robotframework==7.5.1",
    "pkilint==0.13.4",
    "robotframework-requests==0.9.7",
    "pycryptodome==4.4.0",
    "tinyec==0.4.0",
    "bitstring==4.4.0",
    "pyhsslms==2.0.0",
    # relevant for the Mock-CA.
    "Flask==3.1.3",
    # relevant for the CMP client tests.
    "jinja2==3.1.6",
    # required to run the unit test suite (unit_tests/), in parallel across CPU cores.
    "pytest>=9.2.0,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "safety>=3.7.0,<4.0.0",
    "pylint>=4.1.3,<5.0.0",
    "ruff>=0.17.5,<1.0.0",
    "robotframework-robocop==9.4.0",
    "pyright[nodejs]==1.1.414",
    "codespell==2.4.3",
    "reuse==6.3.0",
]
pq = [
    # Post-quantum cryptography support
    # Note: Requires system dependencies (libssl-dev, cmake)
    # Install with: uv pip install -e ".[pq]"
    # The pure-Python wheel compiles the matching OQS C library on first
    # import (0.16.0.2 -> liboqs 0.16.0). Set OQS_INSTALL_PATH to control
    # where the C library is built; it defaults to $HOME/_oqs.
    "liboqs-python==0.16.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
