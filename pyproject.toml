[project]
name = "cmp-test-suite"
version = "0.0.2"
description = "CMP Protocol Compliance Test Suite"
requires-python = ">=3.13"
dependencies = [
    "cryptography==50.0.1",
    "pyasn1==0.6.4",
    "pyasn1-alt-modules==0.4.10",
    "robotframework==7.5",
    "pkilint==0.13.3",
    "robotframework-requests==0.9.7",
    # keyutils-py requires pycryptodome>=4.1.0, so the pin has to follow it.
    "pycryptodome==4.2.0",
    "tinyec==0.4.0",
    "pyhsslms==2.0.0",
    # Provides all key types (import them from `keyutils_py.types`) and the pure-Python FrodoKEM.
    # Pinned by commit hash: the branch has no releases/tags. Branch fix-frodokem-bitstring5.
    "keyutils-py @ git+https://github.com/Guiliano99/keyutils-py.git@82e701432ed90b2c46ada7e84c451d1e749e204e",
    # relevant for the Mock-CA.
    "Flask==3.1.3",
    # relevant for the CMP client tests.
    "jinja2==3.1.6",
    # required to run the unit test suite (unit_tests/), in parallel across CPU cores.
    "pytest>=9.1.1,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "safety>=3.7.0,<4.0.0",
    "pylint>=4.0.4,<5.0.0",
    "ruff>=0.15.12,<1.0.0",
    "robotframework-robocop==9.0.0",
    "pyright[nodejs]==1.1.414",
    "codespell==2.4.3",
    "reuse==6.2.0",
]
pq = [
    # Post-quantum cryptography support
    # Note: Requires system dependencies (libssl-dev, cmake)
    # Install with: uv pip install -e ".[pq]"
    # The pure-Python wheel compiles the matching OQS C library on first
    # import (0.16.0.1 -> liboqs 0.16.0). Set OQS_INSTALL_PATH to control
    # where the C library is built; it defaults to $HOME/_oqs.
    "liboqs-python==0.16.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
